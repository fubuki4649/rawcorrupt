[package]
name = "rawcorrupt"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[[bin]]
name = "corrupt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage"] }
colored = "3.0.0"
exiftool-rs = "0.9.0"
infer = "0.22.0"
mozjpeg-rs = "0.9.2"
rawler = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "fs",
    "io-util",
    "sync"
] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3.17.1"
